services:
  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    # Only what the bot reads, so the bucket's keys stay with the server.
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./bot.toml:/bot.toml:ro
      - bot-data:/data

  homura:
    build:
      context: .
      target: server
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
    volumes:
      - homura-data:/data
    # Also in the Dockerfile, but podman's default image format (OCI) drops it there.
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  bot-data:
  homura-data:

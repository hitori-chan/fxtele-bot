# Run from the repo root: docker compose -f deploy/compose.yml up -d --build
# Needs .env and bot.toml in the repo root.

services:
  bot:
    build:
      context: ..
      target: bot
    restart: unless-stopped
    env_file:
      - path: ../.env
    volumes:
      - ../bot.toml:/bot.toml:ro
      - bot-data:/data

volumes:
  bot-data:

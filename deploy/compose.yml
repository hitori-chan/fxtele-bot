# Run from the repo root: docker compose -f deploy/compose.yml up -d --build
# Needs .env and bot.toml in the repo root. Add your own front end (cloudflared,
# a reverse proxy...) for the server's two listeners; see PLAN.md, section 8.

services:
  bot:
    build:
      context: ..
      target: bot
    restart: unless-stopped
    env_file:
      - path: ../.env
    volumes:
      - ../bot.toml:/bot.toml:ro
      - bot-data:/data

  homura:
    build:
      context: ..
      target: server
    restart: unless-stopped
    # Host networking reaches a WARP proxy on 127.0.0.1:40000; the listeners stay on
    # 127.0.0.1 unless PUBLIC_ADDR / DASHBOARD_ADDR say otherwise.
    network_mode: host
    env_file:
      - path: ../.env
    volumes:
      - homura-data:/data

volumes:
  bot-data:
  homura-data:

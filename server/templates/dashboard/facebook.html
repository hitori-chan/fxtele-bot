{% extends "dashboard/base.html" %}
{% block title %}Facebook{% endblock %}
{% block content %}
<h1>Facebook</h1>
<form method="post" action="/facebook" class="card">
<h2>Fetching</h2>
<label>Proxy <input name="proxy" value="{{ s.proxy.as_deref().unwrap_or_default() }}" placeholder="socks5://127.0.0.1:40000"><small>For requests to Facebook. Empty goes direct.</small></label>
<label>Cookie policy
<select name="cookie_policy">
  <option value="fallback"{% if policy == "fallback" %} selected{% endif %}>Fallback: without login first, with cookies after a login wall</option>
  <option value="always"{% if policy == "always" %} selected{% endif %}>Always use cookies</option>
  <option value="never"{% if policy == "never" %} selected{% endif %}>Never use cookies</option>
</select></label>
<label class="short">Extraction timeout, seconds <input name="extract_timeout_seconds" type="number" min="1" max="60" value="{{ s.extract_timeout_seconds }}"><small>Keep it below how long Telegram waits for a page.</small></label>
<button>Save</button>
</form>

<section class="card">
<h2>Cookies</h2>
<p>{{ cookie_summary }}</p>
<form method="post" action="/facebook/cookies">
  <label class="wide">Cookies <textarea name="cookies" rows="5" spellcheck="false" autocomplete="off" placeholder='[{"domain": ".facebook.com", "name": "c_user", "value": "…", …}]  or  c_user=…; xs=…; datr=…'></textarea><small>Cookie-Editor's Export → JSON, or a <code>Cookie</code> header copied from the developer tools. Copy them while logged in; a header has no expiry dates, so there's no early warning before they expire.</small></label>
  <div class="actions">
  <button>Save cookies</button>
  {%- if has_cookies %}
  <button class="danger" formaction="/facebook/cookies/clear" formnovalidate>Remove cookies</button>
  {%- endif %}
  </div>
</form>
</section>
{% endblock %}

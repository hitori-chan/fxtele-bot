<figure class="chart">
{%- if total == 0 %}
<div class="empty"><span class="icon-tile">{{ crate::dashboard::icon("activity")|safe }}</span><strong>No requests in the last {{ range.label() }}</strong><span>They show up here once people share links in Telegram.</span></div>
{%- else %}
<div class="chart-plot">
  <div class="chart-y" aria-hidden="true">{% for y in y_labels %}<span>{{ y }}</span>{% endfor %}</div>
  <svg class="chart-svg" viewBox="0 0 {{ width }} 100" preserveAspectRatio="none" role="img" aria-label="Requests in the last {{ range.label() }}: {{ total }} in all">
    <line class="grid-line" x1="0" y1="0.5" x2="{{ width }}" y2="0.5"/>
    <line class="grid-line" x1="0" y1="50" x2="{{ width }}" y2="50"/>
    <line class="grid-line base" x1="0" y1="99.5" x2="{{ width }}" y2="99.5"/>
    {%- for bar in bars %}
    <g class="slot" data-tip="{{ bar.slot.tip }}"><title>{{ bar.slot.title }}</title><rect class="hover" x="{{ bar.slot.x }}" y="0" width="10" height="100"/>
    {%- for p in bar.parts %}<rect class="s-{{ p.class }}" x="{{ bar.bx }}" y="{{ p.y }}" width="{{ bar_width }}" height="{{ p.height }}"/>{% endfor -%}
    </g>
    {%- endfor %}
  </svg>
</div>
<div class="chart-x" aria-hidden="true">{% for label in x_labels %}<span>{{ label }}</span>{% endfor %}</div>
<ul class="legend">
  {%- for l in legend %}
  <li><span class="swatch s-{{ l.class }}"></span>{{ l.label }} <b>{{ l.value }}</b></li>
  {%- endfor %}
</ul>
{%- endif %}
</figure>
